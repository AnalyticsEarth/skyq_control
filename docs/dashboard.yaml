  - type: grid
    cards:
    - type: heading
      heading: Now playing
    - type: vertical-stack
      cards:
      - type: media-control
        entity: media_player.sky_q_gateway
      - type: picture-entity
        entity: image.sky_q_gateway_programme_artwork
        show_name: false
        show_state: false
      - type: entities
        title: On now
        entities:
        - sensor.sky_q_gateway_channel
        - sensor.sky_q_gateway_programme
        - sensor.sky_q_gateway_programme_ends
        - sensor.sky_q_gateway_next_programme
        - sensor.sky_q_gateway_app
        - sensor.sky_q_gateway_playback
      - type: entities
        title: Change
        entities:
        - select.sky_q_gateway_channel
        - select.sky_q_gateway_app
      - type: markdown
        title: Guide
        content: '{% set p = ''sensor.sky_q_gateway_programme'' %}{% set n = ''sensor.sky_q_gateway_next_programme'' %}

          **Now:** {{ states(p) }}{% if state_attr(p, ''end'') %} (until {{ as_timestamp(state_attr(p, ''end'')) | timestamp_custom(''%H:%M'')
          }}){% endif %}


          {{ state_attr(p, ''synopsis'') or '''' }}


          **Next:** {{ states(n) }}{% if state_attr(n, ''start'') %} at {{ as_timestamp(state_attr(n, ''start'')) | timestamp_custom(''%H:%M'')
          }}{% endif %}


          Open the media player''s **Browse media** for the full guide.'
  - type: grid
    cards:
    - type: heading
      heading: Recordings
    - type: vertical-stack
      cards:
      - type: gauge
        entity: sensor.sky_q_gateway_disk_usage
        name: Recording space
        min: 0
        max: 100
        needle: true
        severity:
          green: 0
          yellow: 75
          red: 90
      - type: glance
        entities:
        - entity: sensor.sky_q_gateway_recordings
          name: Recorded
        - entity: sensor.sky_q_gateway_scheduled_recordings
          name: Booked
        - entity: sensor.sky_q_gateway_recording_now
          name: Now
        - entity: sensor.sky_q_gateway_failed_recordings
          name: Failed
      - type: entities
        entities:
        - sensor.sky_q_gateway_next_recording
        - binary_sensor.sky_q_gateway_recording
        - event.sky_q_gateway_recordings
      - type: calendar
        initial_view: listWeek
        entities:
        - calendar.sky_q_gateway_scheduled_recordings
        - calendar.sky_q_gateway_recordings
