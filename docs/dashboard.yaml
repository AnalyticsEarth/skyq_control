# Sky Q dashboard for the skyq_control integration.
#
# Settings -> Dashboards -> Add dashboard -> New dashboard from scratch, open it,
# then ⋮ -> Edit dashboard -> ⋮ -> Raw configuration editor, and paste this file.
#
# It uses the gateway's entities (sky_q_gateway). For a Mini, replace every
# "sky_q_gateway" with its name, for example "sky_q_mini_192_168_1_51", and drop the
# Recordings section (recordings live on the gateway).
# Only built-in cards are used.

title: Sky Q
views:
- title: Sky Q
  path: sky-q
  icon: mdi:television
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Remote
    - type: vertical-stack
      cards:
      - type: grid
        columns: 3
        square: false
        cards:
        - type: button
          entity: button.sky_q_gateway_power
          icon: mdi:power
          show_name: true
          show_state: false
          icon_height: 32px
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.sky_q_gateway_power
          hold_action:
            action: none
          name: Power
        - type: button
          entity: button.sky_q_gateway_sky
          icon: mdi:home
