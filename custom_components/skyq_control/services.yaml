send_keys:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    keys:
      required: true
      example: "backup, 1, 0, 1"
      selector:
        text:
          multiple: true
    delay:
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: s

change_channel:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    channel:
      required: true
      example: "101"
      selector:
        text:

launch_app:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    app:
      required: true
      example: "YouTube"
      selector:
        text:

get_guide:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    channels:
      example: "101, 102, sid:3008"
      selector:
        text:
          multiple: true
    start:
      selector:
        datetime:
    hours:
      default: 6
      selector:
        number:
          min: 0.5
          max: 48
          step: 0.5
          unit_of_measurement: h
    search:
      example: "Match of the Day"
      selector:
        text:

record:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    event_id:
      required: true
      example: "Ebc0-39e9"
      selector:
        text:
    series:
      default: false
      selector:
        boolean:

record_now:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    series:
      default: false
      selector:
        boolean:

delete_recording:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    recording_id:
      required: true
      example: "P2902aeb9"
      selector:
        text:
    permanent:
      default: false
      selector:
        boolean:

restore_recording:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    recording_id:
      required: true
      example: "P2902aeb9"
      selector:
        text:

stop_recording:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    recording_id:
      required: true
      example: "P2902aeb9"
      selector:
        text:

update_recording:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    recording_id:
      required: true
      example: "P2902aeb9"
      selector:
        text:
    keep:
      selector:
        boolean:
    locked:
      selector:
        boolean:
    series_link:
      selector:
        boolean:
    resume_position:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box

get_recordings:
  target:
    entity:
      integration: skyq_control
      domain: media_player
  fields:
    status:
      selector:
        select:
          multiple: true
          translation_key: recording_status
          options:
            - recorded
            - scheduled
            - recording
            - failed
            - deleted
    search:
      example: "Match of the Day"
      selector:
        text:
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 2000
          mode: box

get_channels:
  target:
    entity:
      integration: skyq_control
      domain: media_player

get_apps:
  target:
    entity:
      integration: skyq_control
      domain: media_player
