[project]
name = "aioskyq"
version = "0.1.0"
description = "Async client for the local network API of Sky Q set-top boxes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9"]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aioskyq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: talks to a real Sky Q box (set SKYQ_HOST)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# timeout= parameters deliberately mirror aiohttp's API.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aioskyq"]
